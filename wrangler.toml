name = "ckan-mcp-server"
main = "dist/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[build]
command = "npm run build:worker"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "ckan_tool_calls"

# Per-IP request limit on /mcp for the free hosted instance (see src/worker.ts).
[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 200
  period = 60
